name: Build macOS

# Mesma razão do build-windows.yml e do build-linux.yml: gerar um instalador
# de teste sem exigir Xcode/Rust configurados numa máquina Mac do Douglas. Um
# runner macos-latest já vem com Xcode Command Line Tools.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "internal/**"
      - "cmd/**"
      - "package.json"
      - "package-lock.json"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      # beforeBuildCommand (src-tauri/tauri.conf.json) já roda
      # "npm run build:daemon && npm run build" antes de empacotar — não
      # precisa ser repetido aqui.
      - name: Build do instalador Tauri
        run: npm run tauri build

      # Sem assinatura de código (mesma ressalva do Windows): o macOS vai
      # bloquear o .app na primeira abertura via Gatekeeper até o usuário
      # liberar manualmente (clique direito → Abrir), ou até uma assinatura
      # Apple Developer ser configurada — fora de escopo por ora.
      - name: Publicar o instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeux-macos-installer
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
