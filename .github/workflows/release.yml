name: Release

# Publica os instaladores dos 3 SOs como assets de uma GitHub Release, para
# que baixar o ZeuX signifique "abrir a aba Releases e clicar", não "entrar
# no Actions e caçar o artifact do run certo" — que expira e fica atrás de
# login no GitHub, bom só para depuração de CI.
#
# Disparo por tag (ex.: v0.1.0), não por push na main: uma release é um
# checkpoint deliberado, não "toda mudança de código virou versão oficial".
# Até 2026-08-05 existiam build-windows.yml/build-linux.yml/build-macos.yml
# rodando a cada push em main só para gerar esse mesmo artifact efêmero —
# removidos por serem redundantes com este workflow (ver docs/roadmap.md,
# Sprint B). Para gerar um instalador de teste sem cortar uma tag de
# verdade, use workflow_dispatch (`gh workflow run release.yml -f
# tag=<versão>`) numa tag já existente, ou crie uma tag de pré-release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente para republicar os assets (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Cria a Release (vazia) antes de qualquer build. Os 3 jobs de build rodam
  # em paralelo entre si depois disso, mas nenhum deles cria a Release — só
  # anexam assets a uma que já existe. Sem este job, os 3 builds tentariam
  # criar a mesma Release ao mesmo tempo ao terminar, e o primeiro a chegar
  # "vence"; o(s) outro(s) recebe(m) conflito da API do GitHub e falha(m)
  # sem deixar óbvio que faltou um instalador.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        run: npm run tauri build

      - name: Publicar assets na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # Ver build-linux.yml: libdbus-1-dev e pkg-config faltavam aqui até
      # 2026-08-04, achado testando build local numa Ubuntu limpa.
      - name: Instalar dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            patchelf \
            build-essential \
            file

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        run: npm run tauri build

      - name: Publicar assets na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        run: npm run tauri build

      - name: Publicar assets na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
