name: Release

# Publica os instaladores dos 3 SOs como assets de uma GitHub Release, para
# que baixar o ZeuX signifique "abrir a aba Releases e clicar", não "entrar
# no Actions e caçar o artifact do run certo" — que expira e fica atrás de
# login no GitHub, bom só para depuração de CI.
#
# Disparo por tag (ex.: v0.1.0), não por push na main: uma release é um
# checkpoint deliberado, não "toda mudança de código virou versão oficial".
# Até 2026-08-05 existiam build-windows.yml/build-linux.yml/build-macos.yml
# rodando a cada push em main só para gerar esse mesmo artifact efêmero —
# removidos por serem redundantes com este workflow (ver docs/roadmap.md,
# Sprint B). Para gerar um instalador sem passar pelo terminal local, use
# workflow_dispatch (`gh workflow run release.yml -f tag=<versão>`, ou pela
# aba Actions) — funciona tanto para republicar assets de uma tag que já
# existe quanto para cortar uma tag nova em cima do commit que disparou o
# run (ver create-release abaixo). Criar a tag manualmente
# (`git tag vX.Y.Z && git push origin vX.Y.Z`) tem o mesmo efeito, disparando
# pelo `push: tags:` acima.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar — reaproveitada se já existir, criada no commit atual se não existir (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Cria a Release (vazia) antes de qualquer build. Os 3 jobs de build rodam
  # em paralelo entre si depois disso, mas nenhum deles cria a Release — só
  # anexam assets a uma que já existe. Sem este job, os 3 builds tentariam
  # criar a mesma Release ao mesmo tempo ao terminar, e o primeiro a chegar
  # "vence"; o(s) outro(s) recebe(m) conflito da API do GitHub e falha(m)
  # sem deixar óbvio que faltou um instalador.
  create-release:
    name: Preparar Release do ZeuX
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.release_id.outputs.release_id }}
    steps:
      # Checkout no ref que disparou o run (branch, no caso de
      # workflow_dispatch) — nunca direto na tag do input, que pode ainda
      # não existir. Isso é o que travava antes: apontar o `ref:` do
      # checkout pra uma tag inexistente faz o `git fetch` falhar tentando
      # buscar uma ref que não está no remoto (exit code 1, "create-release"
      # em 2026-08-05). fetch-depth: 0 porque `git tag`/`git rev-parse`
      # abaixo precisam enxergar as tags existentes, não só o commit raso.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver a tag (cria em cima do commit atual se ainda não existir)
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse --short "refs/tags/$TAG")"
            HEAD_SHA="$(git rev-parse --short HEAD)"
            echo "Tag $TAG já existe — reaproveitando o commit dela ($TAG_SHA)."
            # Achado em 2026-09-06 (run #17): quem digita no workflow_dispatch o
            # nome de uma tag que já existe de uma tentativa anterior builda o
            # commit ANTIGO dela em silêncio — nenhuma falha, nenhum aviso, só
            # um resultado que parece "o código atual ainda está quebrado"
            # quando na verdade o CI nem olhou o commit atual. Este `::warning`
            # aparece destacado no resumo do run, then o próximo a repetir esse
            # engano vê o aviso antes de investigar código que não mudou.
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::warning::A tag '$TAG' já existia e aponta para $TAG_SHA, NÃO para o commit atual ($HEAD_SHA). Este build vai usar o código de $TAG_SHA. Se a intenção era buildar o código de agora, dispare de novo com uma tag nova."
            fi
          else
            echo "Tag $TAG não existe — criando em cima de $(git rev-parse --short HEAD)."
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}

      - name: Obter o ID da Release
        id: release_id
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: echo "release_id=$(gh api repos/${{ github.repository }}/releases/tags/$RELEASE_TAG --jq .id)" >> "$GITHUB_OUTPUT"

  # Sem auto-updater (2026-08-17: decisão explícita do Douglas de adiar —
  # exigiria gerar e guardar uma chave de assinatura e publicar um manifesto
  # de atualização a cada release, escopo de infraestrutura que ainda não
  # foi aberto). Até lá, "atualizar" é baixar o instalador de novo e rodar
  # por cima — o que só atualiza no lugar (sem duplicar a instalação nem
  # perder configuração) porque `identifier`/`productName` em
  # tauri.conf.json nunca mudam entre versões: o NSIS os usa para registrar
  # a instalação em HKCU\...\Uninstall, e detecta/reaproveita esse registro
  # ao rodar um instalador mais novo. `nsis.installMode: "currentUser"`
  # (tauri.conf.json) fixa esse comportamento (era o padrão implícito;
  # deixado explícito para não depender de um valor-padrão que pode mudar
  # numa versão futura do Tauri) — instala sempre no mesmo lugar fixo
  # (`%LocalAppData%\Programs\zeux`), sem pedir administrador. Isso só
  # funciona se quem instalar aceitar o caminho padrão do assistente: quem
  # navegar manualmente para uma pasta diferente a cada instalador (ex.:
  # "Área de Trabalho\Nova pasta") cria uma instalação paralela, não
  # atualiza a existente.
  build-windows:
    name: Windows 10/11 - instalador
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        # Até o ADR 0015 (R4), esta etapa podia carregar ZEUX_BUNDLE_RETROARCH=1
        # para empacotar RetroArch + os 24 cores no instalador (ADR 0012) — o
        # bundling foi retirado (cores baixados sob demanda pelo zeuxd,
        # RetroArch volta a ser instalação manual), então o build é sempre o
        # rápido, sem essa opção.
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
  build-linux:
    name: Linux - AppImage, DEB e RPM
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # Ver build-linux.yml: libdbus-1-dev e pkg-config faltavam aqui até
      # 2026-08-04, achado testando build local numa Ubuntu limpa.
      - name: Instalar dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            patchelf \
            build-essential \
            file

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        # Até o ADR 0015 (R4), esta etapa podia carregar ZEUX_BUNDLE_RETROARCH=1
        # para empacotar RetroArch + os 24 cores no instalador (ADR 0012) — o
        # bundling foi retirado (cores baixados sob demanda pelo zeuxd,
        # RetroArch volta a ser instalação manual), então o build é sempre o
        # rápido, sem essa opção.
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
  build-macos:
    name: macOS - instalador DMG
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do instalador Tauri
        # Até o ADR 0015 (R4), esta etapa podia carregar ZEUX_BUNDLE_RETROARCH=1
        # para empacotar RetroArch + os 24 cores no instalador (ADR 0012) — o
        # bundling foi retirado (cores baixados sob demanda pelo zeuxd,
        # RetroArch volta a ser instalação manual), então o build é sempre o
        # rápido, sem essa opção.
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

