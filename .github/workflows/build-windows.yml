name: Build Windows

# O ambiente de desenvolvimento local (Windows, doufl) tem Rust e o MSVC Build
# Tools deliberadamente fora dele por enquanto (ver ADR 0004,
# docs/decisoes/0004-adiar-rust-e-tauri.md). Este workflow existe para não
# depender dessa instalação local: um runner windows-latest do GitHub já vem
# com toolchain nativa, então o instalador de teste pode ser gerado sem tocar
# na máquina do Douglas.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "internal/**"
      - "cmd/**"
      - "package.json"
      - "package-lock.json"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do front-end
        run: npm ci

      # beforeBuildCommand (src-tauri/tauri.conf.json) já roda
      # "npm run build:daemon && npm run build" antes de empacotar — não
      # precisa ser repetido aqui.
      - name: Build do instalador Tauri
        run: npm run tauri build

      - name: Publicar o instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeux-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
